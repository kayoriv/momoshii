<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>um cantinho especial ♡</title>
  <style>
    :root {
      --pink: #f58bb5;
      --pink-dark: #e96f9f;
      --pink-light: #ffe4ed;
      --ink: #30232a;
      --paper: rgba(255, 247, 250, .78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      background:
        linear-gradient(rgba(255, 215, 227, .72), rgba(255, 215, 227, .72)),
        url("fundo.jpg") center / cover fixed,
        #f8cbd9;
    }

    .page {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 38px 34px 110px;
      position: relative;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 30%, transparent 5%, rgba(255, 206, 221, .22) 100%);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, .92fr) minmax(300px, 1.08fr);
      grid-template-rows: auto auto;
      gap: 32px 54px;
      align-items: center;
    }

    .photo-frame {
      position: relative;
      padding: 10px;
      border: 7px solid var(--pink);
      background: rgba(255,255,255,.38);
      box-shadow: 0 7px 20px rgba(186, 83, 125, .13);
    }

    .photo-frame img {
      display: block;
      width: 100%;
      aspect-ratio: 1.12 / 1;
      object-fit: cover;
      background: repeating-linear-gradient(135deg, #f6a6c6 0 22px, #f9c0d7 22px 44px);
    }

    .photo-frame.wide img { aspect-ratio: 1.42 / 1; }

    .photo-one { grid-column: 1; grid-row: 1; }
    .photo-two { grid-column: 2; grid-row: 2; margin-top: 10px; }

    .text {
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-size: clamp(2.5rem, 6vw, 5.4rem);
      line-height: 1.08;
      text-align: center;
      overflow-wrap: anywhere;
      padding: 12px;
    }

    .text-one { grid-column: 2; grid-row: 1; transform: rotate(-3deg); }
    .text-two { grid-column: 1; grid-row: 2; transform: rotate(2deg); }

    .small-note {
      margin: 34px auto 0;
      width: fit-content;
      max-width: 90%;
      padding: 12px 22px;
      border: 1px solid rgba(232, 111, 159, .45);
      border-radius: 30px;
      background: rgba(255, 245, 249, .55);
      text-align: center;
      font-size: 1rem;
    }

    .music-player {
      position: fixed;
      z-index: 20;
      right: 20px;
      bottom: 18px;
      width: min(330px, calc(100% - 40px));
      padding: 14px 16px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 20px;
      background: rgba(255, 242, 247, .92);
      box-shadow: 0 8px 28px rgba(147, 64, 98, .2);
      backdrop-filter: blur(10px);
    }

    .music-title { font-weight: 700; margin-bottom: 3px; }
    .track-name { color: #92516d; font-size: .88rem; margin-bottom: 10px; }
    .music-buttons { display: flex; gap: 8px; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      color: white;
      background: var(--pink-dark);
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s, background .18s;
    }

    button:hover { transform: translateY(-2px); background: #d95f90; }
    button:focus-visible { outline: 3px solid #9e4168; outline-offset: 3px; }
    .music-buttons button { flex: 1; }

    .heart {
      position: fixed;
      top: -40px;
      z-index: 10;
      pointer-events: none;
      user-select: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px rgba(180, 80, 120, .12));
    }

    @keyframes fall {
      0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
      10% { opacity: .95; }
      100% { transform: translate3d(var(--drift), 110vh, 0) rotate(360deg); opacity: .15; }
    }

    @media (max-width: 720px) {
      .page { padding: 28px 18px 130px; }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 20px;
      }
      .photo-one, .photo-two, .text-one, .text-two {
        grid-column: 1;
        grid-row: auto;
        margin: 0;
        transform: none;
      }
      .text { font-size: clamp(2.5rem, 12vw, 4rem); padding: 0; }
      .photo-frame { width: min(440px, 100%); margin: auto; }
      .photo-two { margin-top: 8px; }
      .small-note { margin-top: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .heart { display: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <!-- TROQUE foto1.jpg e foto2.jpg pelas suas imagens -->
      <figure class="photo-frame photo-one">
        <img src="foto1.jpg" alt="Nossa primeira foto especial"
             onerror="this.style.background='repeating-linear-gradient(135deg,#f6a6c6 0 22px,#f9c0d7 22px 44px)'">
      </figure>

      <!-- EDITE ESTE TEXTO -->
      <div class="text text-one">meu<br>texto 1</div>

      <!-- EDITE ESTE TEXTO -->
      <div class="text text-two">meu<br>texto 2</div>

      <figure class="photo-frame wide photo-two">
        <img src="foto2.jpg" alt="Mais uma lembrança especial"
             onerror="this.style.background='repeating-linear-gradient(135deg,#f6a6c6 0 22px,#f9c0d7 22px 44px)'">
      </figure>
    </section>

    <p class="small-note">feito com carinho ♡</p>
  </main>

  <aside class="music-player" aria-label="Player de música">
    <div class="music-title">♫ nossa trilha sonora</div>
    <div class="track-name" id="trackName">Música 1</div>
    <div class="music-buttons">
      <button type="button" id="previousBtn" aria-label="Música anterior">⏮</button>
      <button type="button" id="playBtn">▶ tocar</button>
      <button type="button" id="nextBtn" aria-label="Próxima música">⏭</button>
    </div>
    <audio id="audio" preload="none"></audio>
  </aside>

  <script>
    // Coloque os arquivos MP3 na mesma pasta deste HTML e altere os nomes aqui.
    const playlist = [
      { name: "Música 1", file: "musica1.mp3" },
      { name: "Música 2", file: "musica2.mp3" },
      { name: "Música 3", file: "musica3.mp3" }
    ];

    const audio = document.getElementById("audio");
    const trackName = document.getElementById("trackName");
    const playBtn = document.getElementById("playBtn");
    let currentTrack = 0;

    function loadTrack(index, autoplay = false) {
      currentTrack = (index + playlist.length) % playlist.length;
      audio.src = playlist[currentTrack].file;
      trackName.textContent = playlist[currentTrack].name;
      playBtn.textContent = "▶ tocar";
      if (autoplay) {
        audio.play().then(() => playBtn.textContent = "❚❚ pausar")
          .catch(() => playBtn.textContent = "▶ tocar");
      }
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        if (!audio.src) loadTrack(currentTrack);
        audio.play().then(() => playBtn.textContent = "❚❚ pausar")
          .catch(() => {
            playBtn.textContent = "▶ tocar";
            trackName.textContent = "Confira se o arquivo MP3 está na pasta";
          });
      } else {
        audio.pause();
        playBtn.textContent = "▶ tocar";
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => loadTrack(currentTrack + 1, true));
    document.getElementById("previousBtn").addEventListener("click", () => loadTrack(currentTrack - 1, true));
    audio.addEventListener("ended", () => loadTrack(currentTrack + 1, true));

    loadTrack(0);

    // Chuvinha de corações 🩷
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduceMotion) {
      function makeHeart() {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = "🩷";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (14 + Math.random() * 20) + "px";
        heart.style.animationDuration = (5 + Math.random() * 6) + "s";
        heart.style.setProperty("--drift", (Math.random() * 140 - 70) + "px");
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 11500);
      }
      for (let i = 0; i < 18; i++) setTimeout(makeHeart, i * 180);
      setInterval(makeHeart, 420);
    }
  </script>
</body>
</html>
